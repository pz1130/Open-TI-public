#   auth: basic                              # basic（OPTI_SECRET_TICKETS_SERVICENOW_PASSWORD）或 oauth（client_id + OPTI_SECRET_TICKETS_SERVICENOW_CLIENT_SECRET）
#   username: opti.integration
